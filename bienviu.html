
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ebook Seguro</title>

<style>
html,body{
    margin:0;
    padding:0;
    background:#000;
    overflow-x:hidden;
    user-select:none;
    -webkit-user-select:none;
    font-family:Arial,sans-serif;
}

#viewer{
    position:relative;
    z-index:2;
    padding:20px;
}

.pageCanvas{
    width:100%;
    max-width:900px;
    display:block;
    margin:25px auto;
    border-radius:14px;
    box-shadow:0 0 25px rgba(0,0,0,.7);
}

#watermark{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:99999;
}

.mark{
    position:absolute;
    color:rgba(255,0,0,.08);
    font-size:26px;
    transform:rotate(-25deg);
    font-weight:bold;
    white-space:nowrap;
}

#blocked{
    position:fixed;
    inset:0;
    background:#000;
    color:#fff;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:999999;
    font-size:30px;
}

.blur{
    filter:blur(90px) brightness(.1);
}

*{
    -webkit-tap-highlight-color:transparent;
}

</style>
</head>

<body>

<div id="blocked">CONTEÚDO PROTEGIDO</div>
<div id="watermark"></div>
<div id="viewer"></div>

<script>
////////////////////////////////////////////////////
// LOGIN
////////////////////////////////////////////////////
const user = localStorage.getItem("loggedUser");
if(!user){
    location.href="index.html";
}

////////////////////////////////////////////////////
// CONFIG
////////////////////////////////////////////////////
const TOTAL_PAGES = 20;
const viewer = document.getElementById("viewer");

////////////////////////////////////////////////////
// WATERMARK
////////////////////////////////////////////////////
const watermark = document.getElementById("watermark");

function createWatermark(){

    watermark.innerHTML="";

    for(let y=0;y<window.innerHeight;y+=180){
        for(let x=0;x<window.innerWidth;x+=260){

            const div = document.createElement("div");
            div.className = "mark";

            div.style.left = x + "px";
            div.style.top = y + "px";

            div.innerText = `${user} • ${new Date().toLocaleString()}`;

            watermark.appendChild(div);
        }
    }
}

createWatermark();
window.addEventListener("resize", createWatermark);

////////////////////////////////////////////////////
// BLOQUEIO VISUAL
////////////////////////////////////////////////////
function blockScreen(){
    document.getElementById("blocked").style.display="flex";
    viewer.classList.add("blur");
}

function unblockScreen(){
    document.getElementById("blocked").style.display="none";
    viewer.classList.remove("blur");
}

////////////////////////////////////////////////////
// DETECTAR SAÍDA DE FOCO
////////////////////////////////////////////////////
window.addEventListener("blur", blockScreen);
window.addEventListener("focus", ()=>{
    setTimeout(unblockScreen,300);
});

document.addEventListener("visibilitychange", ()=>{
    if(document.hidden){
        blockScreen();
    }else{
        setTimeout(unblockScreen,300);
    }
});

////////////////////////////////////////////////////
// BLOQUEIOS GERAIS
////////////////////////////////////////////////////
[
    "contextmenu",
    "copy",
    "cut",
    "paste",
    "dragstart",
    "selectstart"
].forEach(evt=>{
    document.addEventListener(evt,e=>e.preventDefault());
});

////////////////////////////////////////////////////
// TECLAS
////////////////////////////////////////////////////
document.addEventListener("keydown", e=>{

    const key = e.key.toLowerCase();

    if(
        e.key === "F12" ||
        e.key === "PrintScreen" ||
        (e.ctrlKey && ["s","u","c","p","a","i","j"].includes(key))
    ){
        e.preventDefault();
        blockScreen();
    }
});

////////////////////////////////////////////////////
// ANTI DEVTOOLS
////////////////////////////////////////////////////
setInterval(()=>{

    const width = window.outerWidth - window.innerWidth > 150;
    const height = window.outerHeight - window.innerHeight > 150;

    if(width || height){
        blockScreen();
    }

},1000);

////////////////////////////////////////////////////
// CANVAS RENDER
////////////////////////////////////////////////////
async function renderPage(page){

    const canvas = document.createElement("canvas");
    canvas.className = "pageCanvas";

    const ctx = canvas.getContext("2d");

    viewer.appendChild(canvas);

    ////////////////////////////////////////////////////
    // IMPORTANTE
    // Aqui você deve trocar por endpoint protegido
    ////////////////////////////////////////////////////

    const response = await fetch(`/secure/page-${page}.webp`, {
        headers:{
            Authorization: user
        }
    });

    const blob = await response.blob();

    const img = new Image();

    img.src = URL.createObjectURL(blob);

    img.onload = ()=>{

        canvas.width = img.width;
        canvas.height = img.height;

        ctx.drawImage(img,0,0);

        URL.revokeObjectURL(img.src);
    };
}

////////////////////////////////////////////////////
// LOAD
////////////////////////////////////////////////////
(async()=>{

    for(let i=1;i<=TOTAL_PAGES;i++){
        await renderPage(i);
    }

})();

////////////////////////////////////////////////////
// PRINT
////////////////////////////////////////////////////
window.onbeforeprint = ()=>false;

////////////////////////////////////////////////////
// TOUCH
////////////////////////////////////////////////////
document.addEventListener("touchstart", e=>{
    if(e.touches.length > 2){
        blockScreen();
    }
});

////////////////////////////////////////////////////
// ANTI DEBUG
////////////////////////////////////////////////////
(function(){

    function detect(){

        const start = performance.now();

        debugger;

        const end = performance.now();

        if(end - start > 100){
            blockScreen();
        }
    }

    setInterval(detect,1200);

})();

////////////////////////////////////////////////////
// DESATIVAR CACHE
////////////////////////////////////////////////////
if("caches" in window){

    caches.keys().then(names=>{

        names.forEach(name=>{
            caches.delete(name);
        });
    });
}

////////////////////////////////////////////////////
// IOS
////////////////////////////////////////////////////
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

if(isIOS){

    blockScreen();

    setTimeout(unblockScreen,1000);

    setInterval(()=>{

        if(document.hidden || !document.hasFocus()){
            blockScreen();
        }

    },200);
}

////////////////////////////////////////////////////
// ANDROID SCREEN RECORDING PROTECTION
////////////////////////////////////////////////////
let lastTime = performance.now();

function detectLag(){

    const now = performance.now();

    const diff = now - lastTime;

    if(diff > 200){
        blockScreen();
    }

    lastTime = now;

    requestAnimationFrame(detectLag);
}

requestAnimationFrame(detectLag);

</script>

</body>
</html>
