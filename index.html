<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Luxus Book - Secure Digital Vault</title>
    
    <style>
        /* --- ESTILO LUXUS BOOK --- */
        :root {
            --luxus-gold: #D4AF37;
            --luxus-black: #0a0a0a;
            --luxus-white: #ffffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            background-color: var(--luxus-black);
            font-family: 'Georgia', serif;
            overflow: hidden; /* Impede scroll desnecessário */
            height: 100%;
        }

        #luxus-reader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            width: 100vw;
            position: relative;
            user-select: none !important;
            -webkit-user-select: none;
        }

        /* --- MARCA D'ÁGUA DINÂMICA --- */
        #luxus-tracker {
            position: fixed;
            z-index: 9999;
            opacity: 0.12;
            color: var(--luxus-gold);
            pointer-events: none;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* --- CABEÇALHO --- */
        .luxus-header {
            width: 100%;
            padding: 20px 0;
            text-align: center;
            background: linear-gradient(to bottom, #1a1a1a, transparent);
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            z-index: 100;
        }

        .luxus-header h1 {
            color: var(--luxus-gold);
            margin: 0;
            font-size: 24px;
            letter-spacing: 5px;
        }

        .luxus-header p {
            color: var(--luxus-white);
            font-size: 10px;
            margin: 5px 0 0;
            text-transform: uppercase;
            opacity: 0.6;
        }

        /* --- ÁREA DO LEITOR --- */
        #canvas-holder {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            width: 100%;
            overflow-y: auto;
            background: radial-gradient(circle, #1a1a1a 0%, #0a0a0a 100%);
        }

        #luxus-canvas {
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            max-width: 100%;
            border: 1px solid rgba(212, 175, 55, 0.1);
            background-color: white;
            transition: filter 0.3s ease;
        }

        /* --- ALERTAS E BLOQUEIOS --- */
        #violation-alert {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--luxus-black);
            color: #ff4444;
            z-index: 10000;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: sans-serif;
            padding: 20px;
            box-sizing: border-box;
        }

        /* ESCUDO DE IMPRESSÃO */
        @media print {
            body { display: none !important; }
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="luxus-reader-container">
        <!-- Marca d'água de Rastreamento -->
        <div id="luxus-tracker">LUXUS BOOK - PROPRIEDADE EXCLUSIVA - ID: 2026-X</div>
        
        <!-- Aviso de Violação -->
        <div id="violation-alert">
            <div>
                <h1 style="font-size: 40px;">??</h1>
                <h2>ACESSO BLOQUEADO</h2>
                <p>Foi detectada uma tentativa de captura de ecrã ou interferência técnica.</p>
                <p style="color: gray; font-size: 12px;">Esta ocorrência foi enviada para o administrador do Luxus Book.</p>
            </div>
        </div>

        <header class="luxus-header">
            <h1>LUXUS BOOK</h1>
            <p>Leitura Segura e Exclusiva</p>
        </header>

        <div id="canvas-holder">
            <canvas id="luxus-canvas"></canvas>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // --- 1. BLOQUEIO DE ENGENHARIA REVERSA (ANTI-DEBUG) ---
            setInterval(function() {
                const t0 = performance.now();
                debugger; 
                const t1 = performance.now();
                if (t1 - t0 > 100) {
                    document.getElementById('luxus-reader-container').style.display = 'none';
                    document.body.innerHTML = "<div style='color:white; text-align:center; margin-top:20%;'>Acesso revogado: Uso de ferramentas de inspeção detectado.</div>";
                }
            }, 500);

            // --- 2. PROTEÇÃO CONTRA CAPTURA (SCREENSHOT/PRINT) ---
            window.addEventListener('keyup', (e) => {
                if (e.key === 'PrintScreen' || e.keyCode === 44) {
                    navigator.clipboard.writeText("Acesso Proibido - Luxus Book");
                    triggerViolation();
                }
            });

            function triggerViolation() {
                document.getElementById('canvas-holder').style.display = 'none';
                document.getElementById('violation-alert').style.display = 'flex';
            }

            // --- 3. BLOQUEIO DE TECLAS DE ATALHO ---
            window.addEventListener('keydown', (e) => {
                const forbidden = ['s', 'p', 'u', 'i', 'c', 'j'];
                if ((e.ctrlKey || e.metaKey) && forbidden.includes(e.key.toLowerCase())) {
                    e.preventDefault();
                    return false;
                }
            });

            // --- 4. MARCA D'ÁGUA DINÂMICA (TRACKING) ---
            const tracker = document.getElementById('luxus-tracker');
            document.addEventListener('mousemove', (e) => {
                tracker.style.left = (e.clientX + 20) + 'px';
                tracker.style.top = (e.clientY + 20) + 'px';
            });

            // --- 5. RENDERIZAÇÃO SEGURA (Simulação de carga) ---
            const canvas = document.getElementById('luxus-canvas');
            const ctx = canvas.getContext('2d');

            function renderLuxusPage() {
                canvas.width = 600;
                canvas.height = 800;
                
                // Simulação de conteúdo desenhado (O texto nunca é texto real no DOM)
                ctx.fillStyle = "white";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = "#333";
                ctx.font = "24px Georgia";
                ctx.fillText("Capítulo I: A Arte da Exclusividade", 50, 100);
                
                ctx.font = "16px Georgia";
                const lines = [
                    "Este conteúdo está protegido pela tecnologia Luxus Book.",
                    "O texto que você está a ler não pode ser copiado,",
                    "pois é renderizado como um elemento gráfico dinâmico.",
                    "",
                    "O acesso via ferramentas de programador resultará no",
                    "bloqueio imediato da conta do utilizador."
                ];
                
                lines.forEach((line, index) => {
                    ctx.fillText(line, 50, 150 + (index * 30));
                });

                // Ruído visual anti-OCR
                ctx.fillStyle = "rgba(0,0,0,0.01)";
                for(let i=0; i<canvas.width; i+=5) {
                    ctx.fillRect(i, 0, 1, canvas.height);
                }
            }

            renderLuxusPage();
        })();
    </script>
</body>
</html>
