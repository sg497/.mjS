<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Login</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f172a;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  color: white;
}

/* LOGO FORA DA BOX */
.logo {
  width: 180px;
  height: auto;
  object-fit: contain;
  margin-bottom: 20px;
}

/* caixa login */
.box {
  background: #020617;
  padding: 30px;
  border-radius: 10px;
  width: 320px;
  text-align: center;
}

input, button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border-radius: 5px;
  border: none;
}

button {
  background: #38bdf8;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #0ea5e9;
}

/* responsivo */
@media (max-width: 500px) {
  .box {
    width: 85%;
  }

  .logo {
    width: 140px;
    height: auto;
  }
}
</style>
</head>

<body>

<!-- LOGO FORA DA BOX -->
<img src="Cleanvault actualizado.png" class="logo" alt="Logo">

<div class="box">
  <h2>🔐 Login</h2>

  <input id="user" placeholder="Usuário">
  <input id="pass" type="password" placeholder="Senha">

  <button onclick="login()">Entrar</button>
</div>

<script>
function login() {
  const user = document.getElementById("user").value;
  const pass = document.getElementById("pass").value;

  const users = JSON.parse(localStorage.getItem("users")) || [];

  const found = users.find(u => u.username === user && u.password === pass);

  if(found) {
    localStorage.setItem("loggedUser", user);
    window.location.href = "ebook.html";
  } else {
    alert("Usuário ou senha incorretos");
  }
}
</script>

</body>
</html>
