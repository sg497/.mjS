<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acesso Administrativo</title><link rel="stylesheet" href="admin.css"></head><body class="login-page"><div class="login-top"><button id="themeToggle" class="theme-toggle" title="Alternar tema">☾</button></div><div class="admin-login"><div class="auth-logo">K</div><p class="eyebrow">ÁREA RESTRITA</p><h1>Acesso administrativo</h1><p>Esta área possui um único acesso de administrador.</p><form id="form"><label>E-mail<input id="email" type="email" required></label><label>Senha<input id="password" type="password" required></label><button>Entrar no painel</button><div id="msg"></div></form><a href="/">← Voltar para o site</a></div><script>
function applyTheme(){const saved=localStorage.getItem("ks-theme");const t=saved||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=t;const b=document.querySelector("#themeToggle");if(b)b.textContent=t==="dark"?"☀":"☾"} function toggleTheme(){localStorage.setItem("ks-theme",document.documentElement.dataset.theme==="dark"?"light":"dark");applyTheme()} document.addEventListener("DOMContentLoaded",()=>{applyTheme();document.querySelector("#themeToggle")?.addEventListener("click",toggleTheme)});
form.addEventListener("submit",async e=>{e.preventDefault();msg.textContent="Aguarde...";let r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email.value,password:password.value})});let d=await r.json();if(!r.ok||d.user?.role!=="admin"){msg.textContent="Acesso administrativo inválido.";return}location.href="/admin"});
</script></body></html>
