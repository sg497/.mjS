<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bem-vindo</title>

<style>
body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: linear-gradient(135deg, #020617, #0f172a);
  color: white;
  overflow-x: hidden;
}

/* Fundo */
.bg {
  position: fixed;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at 20% 30%, #38bdf8, transparent),
              radial-gradient(circle at 80% 70%, #22c55e, transparent);
  opacity: 0.15;
  z-index: 0;
}

/* Container */
.container {
  position: relative;
  z-index: 2;
  text-align: center;
  padding: 40px 20px;
  max-width: 900px;
  margin: auto;
}

/* Título */
h1 {
  font-size: 42px;
  margin-bottom: 10px;
}

p {
  opacity: 0.7;
  margin-bottom: 30px;
}

/* Botão */
button {
  background: linear-gradient(135deg, #22c55e, #4ade80);
  border: none;
  padding: 14px 25px;
  font-size: 16px;
  border-radius: 10px;
  cursor: pointer;
  color: black;
  font-weight: bold;
  transition: 0.3s;
  width: 220px;
  max-width: 90%;
}

button:hover {
  transform: scale(1.05);
}

/* Cards */
.stats {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 40px;
  flex-wrap: wrap;
}

.card {
  background: rgba(255,255,255,0.05);
  padding: 20px;
  border-radius: 10px;
  width: 180px;
  min-width: 140px;
}

.card h2 {
  margin: 0;
  color: #22c55e;
}

/* 📱 RESPONSIVO */
@media (max-width: 768px) {

  h1 {
    font-size: 28px;
  }

  p {
    font-size: 14px;
  }

  .stats {
    flex-direction: column;
    align-items: center;
  }

  .card {
    width: 80%;
  }

  button {
    width: 100%;
  }
}

</style>
</head>

<body>

<div class="bg"></div>

<div class="container">
  <h1 id="welcomeText">Bem-vindo</h1>
  <p>Área exclusiva | Mentalidade de alto desempenho 📈</p>

  <button onclick="entrar()">Acessar Ebook</button>

  <div class="stats">
    <div class="card">
      <p>Progresso</p>
      <h2>+0%</h2>
    </div>
    <div class="card">
      <p>Nível</p>
      <h2>Trader</h2>
    </div>
    <div class="card">
      <p>Status</p>
      <h2>Ativo</h2>
    </div>
  </div>
</div>

<script>
const user = localStorage.getItem("loggedUser");

if(!user) {
  window.location.href = "login.html";
}

document.getElementById("welcomeText").innerText = "Bem-vindo, " + user;

function entrar() {
  window.location.href = "Leitura do Preço em Opções Binárias.pdf";
}
</script>

</body>
</html>
