<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bem-vindo</title>

<style>

body{
  margin:0;
  font-family:"Segoe UI",sans-serif;
  background:
  linear-gradient(
    135deg,
    #020617,
    #0f172a
  );

  color:white;
  overflow-x:hidden;
}

/* fundo */

.bg{
  position:fixed;
  width:100%;
  height:100%;

  background:
  radial-gradient(
    circle at 20% 30%,
    #38bdf8,
    transparent
  ),
  radial-gradient(
    circle at 80% 70%,
    #22c55e,
    transparent
  );

  opacity:.15;
  z-index:0;
}

/* topo */

.topbar{

  position:fixed;

  top:0;
  left:0;
  right:0;

  z-index:10;

  display:flex;

  justify-content:space-between;
  align-items:center;

  padding:15px 20px;

  background:
  rgba(0,0,0,.25);

  backdrop-filter:blur(10px);

  border-bottom:
  1px solid rgba(255,255,255,.08);

}

/* timer */

#sessionTimer{
  font-size:14px;
  opacity:.8;
}

/* logout */

.logoutBtn{

  background:
  linear-gradient(
    135deg,
    #ef4444,
    #dc2626
  );

  border:none;

  color:white;

  padding:10px 16px;

  border-radius:10px;

  cursor:pointer;

  font-weight:bold;

  transition:.3s;

}

.logoutBtn:hover{
  transform:scale(1.05);
}

/* container */

.container{
  position:relative;
  z-index:2;

  text-align:center;

  padding:120px 20px 40px;

  max-width:900px;
  margin:auto;
}

/* título */

h1{
  font-size:42px;
  margin-bottom:10px;
}

p{
  opacity:.7;
  margin-bottom:30px;
}

/* botão principal */

.mainBtn{

  background:
  linear-gradient(
    135deg,
    #22c55e,
    #4ade80
  );

  border:none;

  padding:14px 25px;

  font-size:16px;

  border-radius:10px;

  cursor:pointer;

  color:black;

  font-weight:bold;

  transition:.3s;

  width:220px;
  max-width:90%;

}

.mainBtn:hover{
  transform:scale(1.05);
}

/* cards */

.stats{
  display:flex;
  justify-content:center;
  gap:20px;
  margin-top:40px;
  flex-wrap:wrap;
}

.card{

  background:
  rgba(255,255,255,.05);

  padding:20px;

  border-radius:10px;

  width:180px;
  min-width:140px;

  border:
  1px solid rgba(255,255,255,.05);

  backdrop-filter:blur(8px);

}

.card h2{
  margin:0;
  color:#22c55e;
}

/* responsivo */

@media(max-width:768px){

  h1{
    font-size:28px;
  }

  p{
    font-size:14px;
  }

  .stats{
    flex-direction:column;
    align-items:center;
  }

  .card{
    width:80%;
  }

  .mainBtn{
    width:100%;
  }

  .topbar{
    flex-direction:column;
    gap:10px;
  }

}

</style>
</head>

<body>

<div class="bg"></div>

<!-- TOPO -->

<div class="topbar">

  <div id="sessionTimer">
    Sessão expira em: 05:00
  </div>

  <button
    class="logoutBtn"
    onclick="logout()"
  >
    Terminar Sessão
  </button>

</div>

<!-- CONTEÚDO -->

<div class="container">

  <h1 id="welcomeText">
    Bem-vindo
  </h1>

  <p>
    Área exclusiva | Mentalidade de alto desempenho 📈
  </p>

  <button
    class="mainBtn"
    onclick="entrar()"
  >
    Acessar Ebook
  </button>

  <div class="stats">

    <div class="card">
      <p>Progresso</p>
      <h2>+0%</h2>
    </div>

    <div class="card">
      <p>Nível</p>
      <h2>Trader</h2>
    </div>

    <div class="card">
      <p>Status</p>
      <h2>Ativo</h2>
    </div>

  </div>

</div>

<script>

//////////////////////////////////////////////////////
// LOGIN
//////////////////////////////////////////////////////

const user =
localStorage.getItem(
  "loggedUser"
);

if(!user){

  window.location.href =
  "login.html";

}

document.getElementById(
  "welcomeText"
).innerText =
"Bem-vindo, " + user;

//////////////////////////////////////////////////////
// ABRIR EBOOK
//////////////////////////////////////////////////////

function entrar(){

  window.location.href =
  "ebook.html";

}

//////////////////////////////////////////////////////
// LOGOUT
//////////////////////////////////////////////////////

function logout(){

  localStorage.removeItem(
    "loggedUser"
  );

  sessionStorage.clear();

  window.location.href =
  "login.html";

}

//////////////////////////////////////////////////////
// AUTO LOGOUT
//////////////////////////////////////////////////////

const SESSION_TIME =
5 * 60;
// 5 minutos

let timeLeft =
SESSION_TIME;

const timer =
document.getElementById(
  "sessionTimer"
);

//////////////////////////////////////////////////////
// FORMATAR TEMPO
//////////////////////////////////////////////////////

function updateTimer(){

  const min =
  String(
    Math.floor(timeLeft / 60)
  ).padStart(2,"0");

  const sec =
  String(
    timeLeft % 60
  ).padStart(2,"0");

  timer.innerText =
  `Sessão expira em: ${min}:${sec}`;

}

updateTimer();

//////////////////////////////////////////////////////
// CONTAGEM
//////////////////////////////////////////////////////

setInterval(()=>{

  timeLeft--;

  updateTimer();

  if(timeLeft <= 0){

    alert(
      "Sessão encerrada por inatividade."
    );

    logout();

  }

},1000);

//////////////////////////////////////////////////////
// RESETAR INATIVIDADE
//////////////////////////////////////////////////////

function resetSession(){

  timeLeft =
  SESSION_TIME;

}

[
  "click",
  "mousemove",
  "keydown",
  "scroll",
  "touchstart"
]

.forEach(evt=>{

  document.addEventListener(
    evt,
    resetSession
  );

});

</script>

</body>
</html>
