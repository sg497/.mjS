<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ebook Protegido</title>

<style>

html,body{
    margin:0;
    background:#000;
    overflow-x:hidden;
    font-family:Arial, sans-serif;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
}

/* páginas */
.page{
    width:100%;
    max-width:900px;
    margin:20px auto;
    display:block;
    border-radius:10px;
    pointer-events:none;
    position:relative;
    z-index:1;
}

/* watermark */
#watermark{
    position:fixed;
    inset:0;
    z-index:99999;
    pointer-events:none;
    overflow:hidden;
}

.mark{
    position:absolute;
    color:rgba(255,255,255,.06);
    font-size:22px;
    transform:rotate(-25deg);
    white-space:nowrap;
}

/* noise anti-foto */
#noise{
    position:fixed;
    inset:0;
    z-index:9999;
    pointer-events:none;
    opacity:.05;
    mix-blend-mode:overlay;
}

/* bloqueio */
#blocked{
    position:fixed;
    inset:0;
    background:#000;
    color:#fff;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:999999;
    font-size:25px;
    text-align:center;
    padding:20px;
}

/* blur ao bloquear */
.blur{
    filter:blur(50px);
}

/* impedir arrasto */
img{
    -webkit-user-drag:none;
}

</style>
</head>

<body>

<!-- WATERMARK -->
<div id="watermark"></div>

<!-- NOISE -->
<canvas id="noise"></canvas>

<!-- BLOQUEIO -->
<div id="blocked">
Conteúdo protegido
</div>

<!-- EBOOK -->
<div id="ebook">

<img src="ebook/Leitura do Preço em Opções Binárias_page-0001.jpg" class="page">
<img src="ebook/Leitura do Preço em Opções Binárias_page-0002.jpg" class="page">
<img src="ebook/Leitura do Preço em Opções Binárias_page-0003.jpg" class="page">
<img src="ebook/Leitura do Preço em Opções Binárias_page-0004.jpg" class="page">
<img src="ebook/Leitura do Preço em Opções Binárias_page-0005.jpg" class="page">
<img src="ebook/Leitura do Preço em Opções Binárias_page-0006.jpg" class="page">
<img src="ebook/Leitura do Preço em Opções Binárias_page-0007.jpg" class="page">
<img src="ebook/Leitura do Preço em Opções Binárias_page-0008.jpg" class="page">
<img src="ebook/Leitura do Preço em Opções Binárias_page-0009.jpg" class="page">
<img src="ebook/Leitura do Preço em Opções Binárias_page-0010.jpg" class="page">
<img src="ebook/Leitura do Preço em Opções Binárias_page-0011.jpg" class="page">
<img src="ebook/Leitura do Preço em Opções Binárias_page-0012.jpg" class="page">
<img src="ebook/Leitura do Preço em Opções Binárias_page-0013.jpg" class="page">
<img src="ebook/Leitura do Preço em Opções Binárias_page-0014.jpg" class="page">
<img src="ebook/Leitura do Preço em Opções Binárias_page-0015.jpg" class="page">
<img src="ebook/Leitura do Preço em Opções Binárias_page-0016.jpg" class="page">
<img src="ebook/Leitura do Preço em Opções Binárias_page-0017.jpg" class="page">
<img src="ebook/Leitura do Preço em Opções Binárias_page-0018.jpg" class="page">
<img src="ebook/Leitura do Preço em Opções Binárias_page-0019.jpg" class="page">
<img src="ebook/Leitura do Preço em Opções Binárias_page-0020.jpg" class="page">

</div>

<script>

///////////////////////////
// LOGIN
///////////////////////////

const user = localStorage.getItem("loggedUser");

if(!user){
    location.href="index.html";
}

///////////////////////////
// WATERMARK
///////////////////////////

const wm = document.getElementById("watermark");

function createMarks(){

    wm.innerHTML="";

    for(let y=0;y<window.innerHeight;y+=180){

        for(let x=0;x<window.innerWidth;x+=300){

            const div=document.createElement("div");

            div.className="mark";

            div.style.left=x+"px";
            div.style.top=y+"px";

            div.innerText=
            user+
            " • "+
            new Date().toLocaleString()+
            " • "+
            location.hostname;

            wm.appendChild(div);

        }

    }

}

createMarks();

setInterval(createMarks,3000);

///////////////////////////
// NOISE ANTI-FOTO
///////////////////////////

const noise=document.getElementById("noise");
const nctx=noise.getContext("2d");

function drawNoise(){

    noise.width=innerWidth;
    noise.height=innerHeight;

    const img=nctx.createImageData(noise.width,noise.height);

    for(let i=0;i<img.data.length;i+=4){

        const v=Math.random()*255;

        img.data[i]=v;
        img.data[i+1]=v;
        img.data[i+2]=v;
        img.data[i+3]=12;

    }

    nctx.putImageData(img,0,0);

}

setInterval(drawNoise,120);

///////////////////////////
// BLOQUEIOS
///////////////////////////

document.addEventListener(
"contextmenu",
e=>e.preventDefault()
);

document.addEventListener(
"copy",
e=>e.preventDefault()
);

document.addEventListener(
"cut",
e=>e.preventDefault()
);

document.addEventListener(
"dragstart",
e=>e.preventDefault()
);

document.addEventListener(
"selectstart",
e=>e.preventDefault()
);

///////////////////////////
// BLOQUEAR TECLAS
///////////////////////////

document.addEventListener("keydown", e=>{

    if(
        e.key==="F12" ||

        (e.ctrlKey &&
        ["s","u","p","c","a"].includes(
        e.key.toLowerCase()
        ))

    ){
        e.preventDefault();
    }

});

///////////////////////////
// DETECTAR DEVTOOLS
///////////////////////////

setInterval(()=>{

    if(
        window.outerWidth-window.innerWidth>160 ||
        window.outerHeight-window.innerHeight>160
    ){
        lockScreen();
    }

},1000);

///////////////////////////
// TROCA DE ABA
///////////////////////////

document.addEventListener(
"visibilitychange",
()=>{

    if(document.hidden){
        lockScreen();
    }

});

///////////////////////////
// MOBILE MULTI TOUCH
///////////////////////////

document.addEventListener(
"touchstart",
e=>{

    if(e.touches.length>2){
        lockScreen();
    }

});

///////////////////////////
// PRINT
///////////////////////////

window.onbeforeprint=()=>false;

///////////////////////////
// LOCK
///////////////////////////

function lockScreen(){

    document
    .getElementById("blocked")
    .style.display="flex";

    document
    .getElementById("ebook")
    .classList.add("blur");

}

</script>

</body>
</html>
